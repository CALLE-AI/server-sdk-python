[project]
name = "calle-ai"
version = "0.7.0"
description = "Python server SDK for the CALL-E Developer API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["calle", "call-e", "voice-ai", "server-sdk", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "attrs>=22.2.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/CALLE-AI/server-sdk-python"
Repository = "https://github.com/CALLE-AI/server-sdk-python"
"Bug Tracker" = "https://github.com/CALLE-AI/server-sdk-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calle"]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "openapi-python-client>=0.29.0,<0.30.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.3",
    "respx>=0.22.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/calle/generated"]

[tool.mypy]
exclude = ["src/calle/generated"]
