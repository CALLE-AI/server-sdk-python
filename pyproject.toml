[project]
name = "calle-ai"
version = "0.1.0b1"
description = "Python server SDK for the CALL-E Developer API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/CALLE-AI/server-sdk-python"
Repository = "https://github.com/CALLE-AI/server-sdk-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calle"]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "openapi-python-client>=0.29.0,<0.30.0",
    "pytest>=8.0.0",
    "respx>=0.22.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/calle/generated"]

[tool.mypy]
exclude = ["src/calle/generated"]
