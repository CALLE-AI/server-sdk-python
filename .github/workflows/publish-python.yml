name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Python package index to publish.
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
      auth:
        description: Release identity to use.
        required: true
        default: token
        type: choice
        options:
          - token
          - trusted-publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest -q

      - name: Ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src/calle

      - name: Compile examples
        run: uv run python -m py_compile examples/create_and_wait.py examples/webhook_server.py

      - name: Build package
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Publish with package index token
        if: inputs.auth == 'token'
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.repository }}" = "pypi" ]; then
            token="$PYPI_API_TOKEN"
            repository_url="https://upload.pypi.org/legacy/"
          else
            token="$TEST_PYPI_API_TOKEN"
            repository_url="https://test.pypi.org/legacy/"
          fi

          if [ -z "$token" ]; then
            echo "::error::Missing package index token for ${{ inputs.repository }}."
            exit 1
          fi

          TWINE_USERNAME="__token__" TWINE_PASSWORD="$token" \
            uvx twine upload --repository-url "$repository_url" dist/*

      - name: Publish to TestPyPI with Trusted Publishing
        if: inputs.auth == 'trusted-publishing' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI with Trusted Publishing
        if: inputs.auth == 'trusted-publishing' && inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify published package
        run: |
          set -euo pipefail

          if [ "${{ inputs.repository }}" = "pypi" ]; then
            url="https://pypi.org/pypi/calle-ai/json"
          else
            url="https://test.pypi.org/pypi/calle-ai/json"
          fi

          curl --fail --silent --show-error "$url" >/dev/null

      - name: Smoke test published package install
        run: |
          set -euo pipefail

          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"

          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/.venv"
          . "$smoke_dir/.venv/bin/activate"
          python -m pip install --upgrade pip

          if [ "${{ inputs.repository }}" = "pypi" ]; then
            python -m pip install "calle-ai==$version"
          else
            python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              "calle-ai==$version"
          fi

          python -c 'from calle import CalleClient; print(CalleClient)'
